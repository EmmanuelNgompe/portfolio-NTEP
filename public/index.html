<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/image-logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F6FA" />
    <meta property="og:title" content="Emmanuel NGOMPE - Web Developer &amp; Interface Designer" />
    <meta property="og:description" content="Portfolio of Emmanuel NGOMPE, web developer and interface designer in Yaounde, Cameroon." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo-ntep.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <script>
      (function () {
        var language = 'en';
        try {
          var savedLanguage = window.localStorage.getItem('lang');
          if (savedLanguage === 'en' || savedLanguage === 'fr') {
            language = savedLanguage;
          }
        } catch (error) {
          // English remains the default when storage is restricted.
        }
        document.documentElement.lang = language;
      })();
    </script>
    <script>
      (function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';

        try {
          var savedTheme = window.localStorage.getItem('theme');
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme;
          }
        } catch (error) {
          // System preference remains available when storage is restricted.
        }

        document.documentElement.setAttribute('data-theme', theme);
        var themeColor = theme === 'dark' ? '#030712' : '#F3F6FA';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);
      })();
    </script>
    <meta
      name="description"
      content="Emmanuel NGOMPE, web developer and interface designer in Yaounde, Cameroon. Website creation, UI/UX design and custom web applications."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Emmanuel NGOMPE - Web Developer &amp; Interface Designer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
